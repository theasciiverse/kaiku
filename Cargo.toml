[package]
name = "kaiku"
version = "1.0.0"
edition = "2021"
description = "Kaiku — Echoes Home: a sideways typing shmup for the terminal (Asciiverse)"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
gilrs = { version = "0.11", optional = true }
rodio = { version = "0.22", default-features = false, features = ["playback"], optional = true }

[features]
# gamepads are first-class in Asciiverse, and the sound is synthesised in the
# game; build without either with --no-default-features
default = ["gamepad", "sound"]
gamepad = ["dep:gilrs"]
sound = ["dep:rodio"]

[profile.release]
debug = 1
