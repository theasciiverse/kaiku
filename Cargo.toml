[package]
name = "kaiku"
version = "0.1.0"
edition = "2021"
description = "Kaiku — Echoes Home: a sideways typing shmup for the terminal (Asciiverse)"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
gilrs = { version = "0.11", optional = true }

[features]
# gamepads are first-class in Asciiverse; build without with --no-default-features
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
